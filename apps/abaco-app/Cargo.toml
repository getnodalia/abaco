[package]
name = "abaco-app"
description = "Ábaco's desktop app: an executable maths document, drawn in the Nodalia Design Language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "abaco_app"
path = "src/lib.rs"

[[bin]]
name = "abaco-app"
path = "src/main.rs"

[dependencies]
abaco-doc = { path = "../../crates/abaco-doc" }
abaco-expr = { path = "../../crates/abaco-expr" }
nodalia-units = { path = "../../crates/nodalia-units" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
egui = "0.37"
nodalia-theme = { git = "https://github.com/getnodalia/nodalia-design", rev = "439be6caf15ce0b40f527610a894b768117f30bf", features = ["egui", "engineering", "creator"] }
pollster = "0.4"
rfd = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
